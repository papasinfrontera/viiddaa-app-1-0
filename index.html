/* FID-S3-008: mejoras restringidas a Inicio */
#screen:has(.home-audit),#screen:has(.home-detail){height:calc(100dvh - 203px);overflow-y:auto;overscroll-behavior:contain;padding:0 0 18px;scrollbar-width:none}
#screen:has(.home-audit)::-webkit-scrollbar,#screen:has(.home-detail)::-webkit-scrollbar{display:none}
.home-audit .small,.home-audit .sub,.home-detail .small,.home-detail .sub{font-size:12px;color:#514c59}
.home-audit .minipill{font-size:11px;font-weight:600;color:#45404c}
.home-audit .message{font-size:13px;line-height:1.6;color:#292532}
.home-audit h2,.home-detail h2{font-size:15px;font-weight:750;color:#1F1F28}
.home-audit .panel b,.home-detail .panel b{font-weight:730}
.home-audit .ring-wrap label{font-size:12px;color:#302c36;font-weight:650}
.home-audit .banner{font-size:12px;font-weight:650}
.home-audit .home-greeting>b{font-size:14px!important}
.home-audit .home-title{font-size:13px!important}
.home-audit .home-stress-card,.home-audit .home-health-card{display:block;width:100%;text-align:left;border:0;color:inherit;cursor:pointer}
.home-audit .home-stress-card{min-height:100px}
.home-audit .home-stress-card .row{font-size:12px}
.home-empty{display:block;margin:18px 0;color:#5a5363;font-size:13px;font-weight:550}
.home-link{background:none;border:0;font-size:11px;font-weight:750;color:#6740bd;cursor:pointer;padding:4px}
.home-section-title h2{margin:16px 0 6px}
.home-health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.home-health-item{padding:8px 5px;border-bottom:1px solid #f0ecf7;min-width:0}
.home-health-item small{display:block;color:#514c59;font-size:11px;font-weight:600;margin-bottom:5px}
.home-health-item strong{display:block;font-size:19px;color:#201a2b;font-weight:800}
.home-source-date{display:block;color:#625c6b;margin-top:12px;font-size:11px}
.home-detail .row h1{font-size:24px;flex:1}
.home-back{border-radius:50%;border:1px solid #e7def8;background:white;color:#6A3DF0;font-size:23px;width:40px;height:40px;flex-shrink:0}
.home-health-detail{margin:14px 0}.home-health-detail .row{gap:12px}.home-health-detail .row strong{color:#3d256e}
@media(max-width:380px){#screen:has(.home-audit),#screen:has(.home-detail){height:calc(100dvh - 197px)}.home-health-item strong{font-size:17px}}

/* FID-S3-008 approved: compact monitors immediately after greeting, no fabricated stress values. */
.home-audit .home-monitor-duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin:12px 0}
.home-audit .home-mini-monitor{border:1px solid #f0edf7;text-align:left;min-width:0;min-height:125px;padding:12px 11px;cursor:pointer}
.home-mini-heading{display:flex;gap:5px;align-items:center;font-size:11px;color:#262030}
.home-mini-heading b{font-size:11px;font-weight:760;line-height:1.2}
.home-mini-icon{display:inline-grid;place-items:center;min-width:25px;height:25px;border-radius:9px;background:#f0eaff;color:#6A3DF0;font-size:19px}
.home-mini-arrow{margin-left:auto;font-size:18px;color:#6A3DF0}
.home-mini-main{display:block;color:#56505e;font-size:11px;margin:11px 0 5px}
.home-mini-main strong{display:block;font-size:21px;line-height:1.35;color:#1F1F28;font-weight:800}
.home-mini-sub{display:block;font-size:11px;font-weight:650;color:#5b5368}
.home-mini-empty{display:block;font-size:16px;color:#514a5c;font-weight:750;margin:17px 0 8px}
.home-nutrition-content{display:flex;align-items:center;gap:10px}
.home-nutrition-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:13px;background:#eeffda;color:#40862a;font-size:24px;line-height:1}
@media(max-width:350px){.home-audit .home-monitor-duo{gap:6px}.home-audit .home-mini-monitor{padding:9px 7px}.home-mini-heading b{font-size:10px}}
.home-audit .home-personal-date{font-size:clamp(22px,6vw,29px);line-height:1.18;letter-spacing:-.7px;min-width:0;flex:1}.home-audit .home-date-name{font-weight:800;color:#1F1F28}.home-audit .home-date-text{font-weight:750;color:#1F1F28}@media(max-width:390px){.home-audit .home-date-text{display:block}}
/* VIIDDAA S3 · Cabecera aprobada: avatar y procedencia real de datos */
.viiddaa-profile-header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin:4px 0 13px;min-height:44px}
.header-person{display:inline-flex;align-items:center;gap:7px;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:#1F1F28}
.avatar-real{height:39px;width:39px;min-width:39px;object-fit:cover;border-radius:50%;border:2px solid #f2eaff;display:block}
.header-person-name{font-size:12px;font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-brand{white-space:nowrap;font-size:15px;letter-spacing:-.7px}
.header-tools{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.device-state{width:36px;height:36px;border:1px solid #eee9f2;border-radius:50%;display:grid;place-items:center;position:relative;color:#6A3DF0;background:#fff}
.device-state-dot{width:7px;height:7px;border-radius:50%;position:absolute;right:2px;top:3px;background:#a6a0ae;border:1px solid white}
.device-info{padding:12px 4px;color:#1F1F28;text-align:center}
.device-info-icon{background:#f0ebff;color:#6A3DF0;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:24px;margin:0 auto 14px}
.device-info h3{font-size:17px;font-weight:760;margin:6px 0}
.device-info p{font-size:13px;color:#625b6d;margin:7px 0 20px}
.device-info-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid #f0eaf5;text-align:left;font-size:12px;gap:9px}
.device-info-row strong{font-weight:700;color:#3b3342;text-align:right}
.profile-photo-large{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid #eee7ff}
@media(max-width:365px){.header-person-name{display:none}.header-brand{font-size:15px}.viiddaa-profile-header{gap:5px}}

/* FID-S3-010 Home: no repeating avatar, no duplicated header or trend cards. */
.home-audit>.row:first-child>.home-personal-date{margin:4px 0 12px}
.home-audit .home-greeting{padding:13px 15px;margin:10px 0 9px}
.home-audit .home-greeting .message{margin:0;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.home-audit .home-trend-panel{padding:13px 12px;margin:12px 0}
.home-audit .home-trend-header{display:flex;align-items:start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.home-audit .home-trend-header>b{font-size:14px;line-height:1.3;font-weight:780}
.home-audit .home-trend-key{font-size:10px;color:#494452;display:flex;align-items:center;gap:4px}
.home-trend-key i{width:7px;height:7px;border-radius:50%;display:inline-block}
.home-trend-key i.strain-key{background:#327ddb}.home-trend-key i.recovery-key{background:#36a53e;margin-left:5px}
.home-trend-svg{width:100%;height:auto;display:block;margin:8px auto}
.home-trend-foot{border-top:1px solid #eeeaf4;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:10px}
.home-trend-foot div{display:flex;flex-direction:column;gap:4px}
.home-trend-foot span{font-size:11px;color:#625b69;font-weight:600}
.home-trend-foot strong{font-size:17px;font-weight:800;color:#1F1F28}
.home-nutrition,.home-nutrition-content{min-width:0}
.home-nutrition .home-nutrition-content>div{min-width:0}
.home-nutrition .home-nutrition-content p{white-space:normal!important;overflow:visible!important;word-break:normal;font-size:12px;color:#514a59}
#screen:has(.home-audit){height:calc(100dvh - 174px);overflow-y:auto;padding-bottom:135px;box-sizing:border-box}
@media(max-width:380px){#screen:has(.home-audit){height:calc(100dvh - 169px)}.home-audit .home-trend-header>b{font-size:13px}}

/* FID-S3-011: estilos exclusivos de Inicio. Estabiliza los anillos durante el scroll. */
.home-audit .ringgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;align-items:start;min-width:0}
.home-audit .ring-wrap{min-width:0;padding:7px 0 3px;text-align:center;overflow:visible}
.home-audit .ring{position:relative;isolation:isolate;flex-shrink:0;overflow:hidden;max-width:100%;aspect-ratio:1/1;box-sizing:border-box}
.home-audit .ring:before{position:absolute;inset:7px;width:auto;height:auto;z-index:0}
.home-audit .ring span{position:relative;z-index:1}
.home-audit .ring-wrap label{display:block;white-space:normal;overflow-wrap:break-word;line-height:1.25;font-size:11px;font-weight:700;min-height:2.5em}
.home-audit .home-trend-key .recovery-key{background:#D6FF63;border:1px solid #768d24}
.home-audit .home-trend-key .strain-key{background:#6A3DF0}
.home-audit .home-trend-svg text{font-family:-apple-system,BlinkMacSystemFont,"Inter",Arial,sans-serif}
#screen:has(.home-audit){padding-bottom:190px}
@media(max-width:370px){.home-audit .ring{width:64px;height:64px}.home-audit .ring:before{inset:6px}.home-audit .ring span{font-size:18px}.home-audit .ring-wrap label{font-size:10px}}

/* FID-S3-012 — únicamente tamaño y tipografía de los tres anillos en Inicio */
.home-audit .ringgrid{column-gap:6px}
.home-audit .ring-wrap{padding-top:8px;padding-bottom:5px}
.home-audit .ring{width:84px;height:84px;max-width:100%;margin:0 auto 8px;aspect-ratio:1/1;position:relative;overflow:hidden;box-sizing:border-box}
.home-audit .ring:before{position:absolute;inset:9px;width:auto;height:auto;border-radius:50%}
.home-audit .ring span{font-size:23px;font-weight:780;letter-spacing:-.6px;line-height:1}
.home-audit .ring-wrap label{font-size:12px;line-height:1.25;font-weight:700;min-height:2.5em;overflow-wrap:normal;word-break:normal;white-space:normal}
@media(max-width:355px){.home-audit .ring{width:76px;height:76px}.home-audit .ring:before{inset:8px}.home-audit .ring span{font-size:21px}.home-audit .ring-wrap label{font-size:11px}.home-audit .ringgrid{column-gap:4px}}

/* FID-S3-013 — modificación restringida a gráficos de Inicio */
.fid-hist-card{padding:14px 13px}
.fid-hist-card .row{align-items:flex-start;gap:10px}
.fid-hist-card b{font-size:17px;font-weight:750}
.fid-muted,.fid-hist-latest small{font-size:11px;color:#615969;margin:4px 0 0}
.fid-hist-latest{text-align:right;display:flex;flex-direction:column;gap:1px}
.fid-hist-latest strong{font-size:16px;font-weight:800}
.fid-bars{display:flex;align-items:end;gap:2px;height:126px;border-bottom:1px solid #dcd8e2}
.fid-bar{align-self:stretch;display:flex;align-items:end;justify-content:center;flex:1;min-width:0;padding:0;border:0;background:transparent}
.fid-bar>span{height:var(--h);width:100%;max-width:18px;background:#6A3DF0;border-radius:5px 5px 0 0}
.fid-bar.fid-missing>span{background:#dcd8e3;min-height:3px}
.fid-bar.selected>span{outline:2px solid #D6FF63;filter:brightness(.8)}

/* Curvas basadas solo en ciclos fisiológicos registrados. Faltantes = cortes en la línea. */
function homeTrendChart(){
 const endRecord=cycles.at(-1);if(!endRecord?.date)return '';
 const lastDay=new Date(endRecord.date+'T12:00:00Z');
 const byDay=new Map();
 cycles.forEach(c=>{if(c?.date)byDay.set(c.date,c)});

   let d=new Date(lastDay);d.setUTCDate(d.getUTCDate()-6+i);

   return {date,weekday:d.toLocaleDateString('es-ES',{weekday:'short',timeZone:'UTC'}).replace('.',''),day:d.getUTCDate(),data:byDay.get(date)||null}
 });
 const W=344,H=220,x0=32,x1=308,y0=34,y1=155,step=(x1-x0)/6;
 const numeric=v=>typeof v==='number'&&Number.isFinite(v);
 const pos=(v,max)=>y1-v/max*(y1-y0);
 const fmtChart=(v,key)=>key==='recovery'?Math.round(v)+' %':fmt(v,1);
 let svg='<svg class="home-trend-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Esfuerzo y recuperación, con cifras de cada registro disponible">';
 [0,0.5,1].forEach(f=>{let y=y1-(y1-y0)*f;svg+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#e5e1ec" stroke-width="1"/><text x="25" y="'+(y+4)+'" text-anchor="end" fill="#6A3DF0" font-size="10" font-weight="650">'+Math.round(21*f)+'</text><text x="337" y="'+(y+4)+'" text-anchor="end" fill="#4b5a17" font-size="10" font-weight="650">'+Math.round(100*f)+'%</text>'});
 const series=[{key:'recovery',max:100,color:'#D6FF63',labelColor:'#293413',offset:-15},{key:'strain',max:21,color:'#6A3DF0',labelColor:'#6A3DF0',offset:17}];
 for(const spec of series){
   let segments=[],part=[];
   pts.forEach((p,i)=>{
     const v=p.data?.[spec.key];
     if(numeric(v))part.push({x:x0+i*step,y:pos(v,spec.max),v,date:p.date});
     else if(part.length){segments.push(part);part=[]}
   });
   if(part.length)segments.push(part);
   segments.forEach(seg=>{
     svg+='<polyline points="'+seg.map(z=>z.x.toFixed(1)+','+z.y.toFixed(1)).join(' ')+'" fill="none" stroke="'+spec.color+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
     seg.forEach(z=>{
       // Las etiquetas del esfuerzo van debajo; las de recuperación, encima.

       svg+='<text x="'+z.x.toFixed(1)+'" y="'+yy.toFixed(1)+'" text-anchor="middle" font-size="9.7" font-weight="800" fill="'+spec.labelColor+'" stroke="#fff" stroke-width="3" paint-order="stroke">'+fmtChart(z.v,spec.key)+'</text>'
     })
   })
 }
 pts.forEach((p,i)=>{
   const x=x0+i*step;
   svg+='<text x="'+x+'" y="197" text-anchor="middle" font-size="10" fill="#504958">'+p.weekday+'</text><text x="'+x+'" y="210" text-anchor="middle" font-size="10" font-weight="750" fill="#2d2734">'+p.day+'</text>'
 });

 return '<div class="panel home-trend-panel"><div class="home-trend-header"><b>Esfuerzo y recuperación</b><span class="home-trend-key"><i class="strain-key"></i>Esfuerzo <i class="recovery-key"></i>Recuperación</span></div>'+svg+'<div class="home-trend-foot"><div><span>Calificación del sueño</span><strong>'+(numeric(sleep)?fmt(sleep)+' %':'—')+'</strong></div><div><span>Deuda de sueño</span><strong>'+debt+'</strong></div></div></div>'
}

const HOME_MATRIX={
 recovery:{name:'Recuperación',unit:'%',digits:0,max:100},
 sleep:{name:'Sueño',unit:'h',digits:1},
 rhr:{name:'Frecuencia cardíaca en reposo',unit:'lpm',digits:0},
 hrv:{name:'HRV',unit:'ms',digits:0},
 spo2:{name:'SpO₂',unit:'%',digits:1},
 strain:{name:'Esfuerzo',unit:'de 21',digits:1,max:21},
 resp:{name:'Frecuencia respiratoria',unit:'rpm',digits:1}
};
const homeNumeric=v=>v!==null&&v!==undefined&&Number.isFinite(Number(v));
function homeDate(d){return d?new Date(d+'T12:00:00Z').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'Sin fecha'}
function homeVal(k,v){if(!homeNumeric(v))return 'Sin registro';if(k==='sleep')return Math.floor(Number(v)/60)+' h '+Math.round(Number(v)%60)+' min';let m=HOME_MATRIX[k];return fmt(Number(v),m.digits)+' '+m.unit}
function homeLast(k){return [...cycles].reverse().find(r=>homeNumeric(r[k]))||null}

// REG-UX-014.1: promedio real de la ventana, sin datos ausentes ni umbrales inventados.
function homeAverageOverlay(value,max,key,count){
 if(count<2||!homeNumeric(value)||!homeNumeric(max)||max<=0)return '';
 const pct=Math.max(0,Math.min(100,Number(value)/max*100));
 return '<div class="fid-average-line" style="--avg:'+pct+'%" aria-label="Promedio del período: '+homeVal(key,value)+'"><span>PROM. '+homeVal(key,value)+'</span></div>'

/* FID-UX-HOME-008: carrusel automático solo visible, sin controles ni pausas que alteren módulos */
let fidAutoTimer=null;
let fidAutoObserver=null;
let fidAutoVisible=false;
let fidAutoPaused=false;
let fidAutoBound=false;
const fidAutoReduced=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function fidAutoStop(){
 if(fidAutoTimer){clearInterval(fidAutoTimer);fidAutoTimer=null}
 if(fidAutoObserver){fidAutoObserver.disconnect();fidAutoObserver=null}
 fidAutoVisible=false;fidAutoPaused=false;
}
function fidAutoEligible(){
 const slot=document.querySelector('#screen .fid-bnr-slot');
 return !!slot&&slot.isConnected&&S.tab==='inicio'&&!S.homeDetail&&
        !document.hidden&&!fidAutoReduced()&&fidAutoVisible&&!fidAutoPaused&&
        !$('overlay').classList.contains('show');
}
function fidAutoSchedule(){
 if(fidAutoTimer){clearInterval(fidAutoTimer);fidAutoTimer=null}
 if(!fidAutoEligible())return;
 fidAutoTimer=setInterval(()=>{
  if(!fidAutoEligible()){fidAutoSchedule();return}
  const slot=document.querySelector('#screen .fid-bnr-slot');
  if(!slot)return;
  fidBannerIndex=(fidBannerIndex+1)%4;
  slot.innerHTML=fidBanner();
  animateFidBannerText();
  fidWireBannerCTA();
 },7000);
}
function fidWireBannerCTA(){
 const main=$('fidBannerOpen');if(!main)return;
 main.onclick=()=>{
   fidAutoPaused=true;fidAutoSchedule();
   if(fidBannerIndex===0){bannerPanelOffer();return}
   if(fidBannerIndex===1){S.homeDetail='circle:sleep';S.fidDaysCircle=null;showScreen('inicio');return}
   if(fidBannerIndex===2){chat('¿Cuál es mi última recuperación registrada y cómo se compara con el promedio de mis ciclos disponibles?');return}
   if(fidBannerIndex===3){chat('¿Cómo dormí en el último registro disponible y cuál fue mi HRV y mi recuperación?');return}
 };
}
function wireFidBanners(){
 fidAutoStop();
 const slot=document.querySelector('#screen .fid-bnr-slot');
 if(!slot)return;
 animateFidBannerText();fidWireBannerCTA();
 slot.addEventListener('mouseenter',()=>{fidAutoPaused=true;fidAutoSchedule()});
 slot.addEventListener('mouseleave',()=>{fidAutoPaused=false;fidAutoSchedule()});
 slot.addEventListener('focusin',()=>{fidAutoPaused=true;fidAutoSchedule()});
 slot.addEventListener('focusout',()=>{fidAutoPaused=false;fidAutoSchedule()});
 slot.addEventListener('touchstart',()=>{fidAutoPaused=true;fidAutoSchedule()},{passive:true});
 slot.addEventListener('touchend',()=>{fidAutoPaused=false;fidAutoSchedule()},{passive:true});
 if('IntersectionObserver' in window){
   fidAutoObserver=new IntersectionObserver(entries=>{
    fidAutoVisible=entries.some(e=>e.isIntersecting&&e.intersectionRatio>=0.25);
    fidAutoSchedule();
   },{threshold:[0,0.25,0.6]});
   fidAutoObserver.observe(slot);
 }else{fidAutoVisible=true;fidAutoSchedule()}
 if(!fidAutoBound){
  fidAutoBound=true;
  document.addEventListener('visibilitychange',fidAutoSchedule);
  if(window.matchMedia){
   const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
   if(reduced.addEventListener)reduced.addEventListener('change',fidAutoSchedule);
  }
 }
}

async function loadProtectedWhoop(){

    sleepScore:numOrNull(x.sleep_score_pct),
    resp:numOrNull(x.source_payload?.['Frecuencia respiratoria (rpm)'])
  }));
  const workoutsLive=w.map(x=>({
    date:localWhoopDate(x.source_payload?.['Hora de inicio del entrenamiento'],x.workout_start),
    activity:String(x.activity_name),mins:numOrNull(x.duration_min),
    strain:numOrNull(x.activity_strain),
    avgHR:numOrNull(x.source_payload?.['FC promedio (lpm)'])
  }));

  setWhoopData({cycles:cyclesLive,workouts:workoutsLive,source:'Historial sincronizado'});
}
